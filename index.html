<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kakti King Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#EEF0EA;--paper:#F7F8F4;--ink:#1B211D;--ink-2:#4A544D;--ink-3:#7C877F;--line:#CFD5CB;--accent:#3E6B52;--accent-ink:#F4F7F2;--block:#9A3A2C;--input:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--ground:#151916;--paper:#1C211D;--ink:#E7EAE3;--ink-2:#B6BEB6;--ink-3:#7F8A80;--line:#333B35;--accent:#7FB08F;--accent-ink:#0F1511;--block:#D97A69;--input:#11150F}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);padding:24px}
h1{font-weight:900;font-size:26px;letter-spacing:-.02em;margin:0 0 4px;line-height:1}
.sub{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 18px}
label{display:block;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input[type=password],input[type=text]{width:100%;font:18px "IBM Plex Mono",ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--input);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:700 15px "Archivo",Arial,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.6}
.remember{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.msg{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--block);margin-top:10px;min-height:1.2em}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form class="box" id="gate">
  <h1>Kakti King Ledger</h1>
  <p class="sub">Armando &amp; Jay · private</p>
  <label for="code">Access code</label>
  <input id="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
  <div class="row"><button type="submit" id="go">Open</button><label class="remember"><input type="checkbox" id="remember" checked> Remember on this phone</label></div>
  <p class="msg" id="msg" aria-live="polite"></p>
</form>

form.addEventListener("submit", (e) => { e.preventDefault(); unlock(input.value.trim(), false); });
let saved = null; try { saved = localStorage.getItem("kakti-code"); } catch(e){}
if (saved) unlock(saved, true); else input.focus();
})();
</script>
